# Creates a GitHub Release with a zip of the site whenever a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
# Release notes come from the matching "## [vX.Y.Z]" section of CHANGELOG.md.
# Tags starting with v0. are marked as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package site
        run: |
          mkdir -p dist
          zip -r "dist/suho-detailing-site-${GITHUB_REF_NAME}.zip" \
            index.html styles.css script.js CNAME README.md CHANGELOG.md .nojekyll assets \
            -x "assets/gallery/.gitkeep"

      - name: Extract release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $GITHUB_REF_NAME" > notes.md; fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in v0.*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/suho-detailing-site-${GITHUB_REF_NAME}.zip" \
            --title "SUHO Detailing site $GITHUB_REF_NAME" \
            --notes-file notes.md $PRE
